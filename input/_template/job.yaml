schema: 1
id: replace-me
title: Replace Me
kind: video

audio:
  enabled: true

# Optional program-audio layer. The repository-wide policy keeps incremental
# media spend at $0, so paid generation (including Lyria) is blocked.
soundtrack:
  enabled: false

  music:
    enabled: false
    # Zero-cost policy: use a local owned/CC0 file, or leave music disabled.
    source: file
    file: music/bed.mp3
    gain_db: -28
    fade_in_seconds: 0.6
    fade_out_seconds: 1.2
    duck_threshold: 0.025
    duck_ratio: 8
    duck_attack_ms: 20
    duck_release_ms: 300

  sfx:
    enabled: false
    gain_db: -8
    # Each event can use at_ms, at_seconds, anchor_text, or part + offset_ms.
    # Raw SFX committed here must be redistribution-safe (prefer CC0).
    events: []

video:
  enabled: true
  engine: hyperframes
  width: 1920
  height: 1080
  fps: 30
  qa_fps: 6
  manual_visual_review: true
