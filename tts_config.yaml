# TTS Factory configuration
#
# This file is the source of truth for synthesis, assembly, and word alignment.
# Individual transcript files may override the documented TTS fields in YAML front matter.

# Stage 1: speech synthesis
model: gemini-3.1-flash-tts-preview
voice: Kore

audio_profile: >-
  A natural, trustworthy narrator with a warm, confident presence.
scene: >-
  A clean, quiet recording studio. Close microphone, no background noise.
director_notes: >-
  Speak naturally and conversationally. Preserve the transcript exactly. Use clear
  articulation, tasteful emotional variation, and comfortable pacing. Do not read
  instructions, headings, YAML metadata, or labels aloud.

# Long source files are split near paragraph/sentence boundaries and stitched into
# one part WAV. For production lessons, prefer several short numbered source files.
max_chars_per_request: 5000

# Requests are intentionally sequential.
request_delay_seconds: 2

retry:
  max_attempts: 5
  initial_delay_seconds: 4
  max_delay_seconds: 60

# Stage 2: assemble audio/<lesson>/*.wav in filename order.
assembly:
  gap_ms: 300
  mp3_bitrate: 192k

# Stage 3: align each short source WAV independently, cache its word timings, then
# offset all part-relative timings into final/<lesson>.transcript.json.
# Only audio-input models belong in this router.
transcription:
  enabled: true
  models:
    - gemini-3.5-flash-lite
    - gemini-3.1-flash-lite
  attempts_per_model: 2
  initial_delay_seconds: 3
  max_delay_seconds: 20
  write_vtt: true
