# Video Factory — audio stage configuration
#
# Source of truth for speech synthesis, assembly, and word alignment.
# Job-specific creative direction belongs in input/<job>/ and transcript front matter.

# Stage 1: speech synthesis
# Production speech is rendered by Qwen3-TTS 0.6B on Modal.
provider: qwen_modal

qwen:
  model: Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice
  speaker: Aiden
  language: English

  # The Modal service hard-limits one request to 2400 chars. Leave headroom for
  # reliable long-form chunking inside the factory.
  max_chars_per_request: 2200
  timeout_seconds: 900
  chunk_gap_ms: 180
  request_delay_seconds: 0.25

  retry:
    max_attempts: 4
    initial_delay_seconds: 3
    max_delay_seconds: 30

# Stage 2: assemble audio/<job>/*.wav in filename order.
assembly:
  gap_ms: 300
  mp3_bitrate: 192k

# Stage 3: listen back to each short Qwen WAV part with HyperFrames' local
# transcription stack and derive word-level timing from the actual rendered
# voice. This timing is mandatory for visual synchronization.
transcription:
  enabled: true
  provider: hyperframes_whisper
  engine: whisper
  model: small.en
  language: en
  timeout_seconds: 1200
  min_reference_coverage: 0.72
  write_vtt: true
