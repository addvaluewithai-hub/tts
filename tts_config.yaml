# Video Factory — audio stage configuration
#
# Source of truth for speech synthesis, assembly, and word alignment.
# Job-specific creative direction belongs in input/<job>/ and transcript front matter.

# Stage 1: speech synthesis
model: gemini-3.1-flash-tts-preview
voice: Kore

audio_profile: >-
  A natural, trustworthy narrator with a warm, confident presence.
scene: >-
  A clean, quiet recording studio. Close microphone, no background noise.
director_notes: >-
  Speak naturally and conversationally. Preserve the authored transcript faithfully.
  Use clear articulation, tasteful emotional variation, and comfortable pacing. Do not
  read instructions, headings, YAML metadata, role labels, or control markup aloud.

# Internal emergency limit only. Normal production reliability comes from several
# short numbered transcript files, not per-file max-character tuning.
max_chars_per_request: 5000

# Requests are intentionally sequential.
request_delay_seconds: 2

# Short transient/API retries inside one request. The GitHub audio workflow also has
# a bounded 60-second same-run recovery loop for persistent Gemini 429 quota windows.
retry:
  max_attempts: 5
  initial_delay_seconds: 4
  max_delay_seconds: 60

# Stage 2: assemble audio/<job>/*.wav in filename order.
assembly:
  gap_ms: 300
  mp3_bitrate: 192k

# Stage 3: align each short source WAV independently, cache its word timings, then
# offset all part-relative timings into final/<job>.transcript.json.
# Only audio-input models belong in this router.
transcription:
  enabled: true
  models:
    - gemini-3.5-flash-lite
    - gemini-3.1-flash-lite
  attempts_per_model: 2
  initial_delay_seconds: 3
  max_delay_seconds: 20
  write_vtt: true
