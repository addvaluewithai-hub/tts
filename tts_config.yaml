# Video Factory — audio stage configuration
#
# Source of truth for speech synthesis, assembly, and word alignment.
# Job-specific creative direction belongs in input/<job>/ and transcript front matter.

# Stage 1: speech synthesis
# Production speech is rendered by Qwen3-TTS 0.6B on Modal. Gemini is no longer
# used to synthesize narration. The aligner below still uses audio-input Gemini
# models for word timing; that is a separate stage and can be replaced later.
provider: qwen_modal

qwen:
  model: Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice
  speaker: Aiden
  language: English

  # The Modal service hard-limits one request to 2400 chars. Leave headroom for
  # reliable long-form chunking inside the factory.
  max_chars_per_request: 2200
  timeout_seconds: 900
  chunk_gap_ms: 180
  request_delay_seconds: 0.25

  retry:
    max_attempts: 4
    initial_delay_seconds: 3
    max_delay_seconds: 30

# Stage 2: assemble audio/<job>/*.wav in filename order.
assembly:
  gap_ms: 300
  mp3_bitrate: 192k

# Stage 3: align each short source WAV independently, cache its word timings, then
# offset all part-relative timings into final/<job>.transcript.json.
# This is alignment/transcription only, not narration generation.
transcription:
  enabled: true
  models:
    - gemini-3.5-flash-lite
    - gemini-3.1-flash-lite
  attempts_per_model: 2
  initial_delay_seconds: 3
  max_delay_seconds: 20
  write_vtt: true
