name: TTS Factory

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "transcripts/**/*.txt"
      - "transcripts/**/*.md"
      - "tts_config.yaml"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/generate-tts.yml"

permissions:
  contents: write

concurrency:
  group: tts-factory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync current main
        if: github.ref_name == 'main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run factory
        id: factory
        continue-on-error: true
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -uo pipefail
          max_factory_attempts=5
          retry_delay_seconds=60

          for attempt in $(seq 1 "$max_factory_attempts"); do
            echo "Factory attempt ${attempt}/${max_factory_attempts}"
            log_file="$(mktemp)"

            set +e
            python scripts/run_factory.py 2>&1 | tee "$log_file"
            status=${PIPESTATUS[0]}
            set -e

            if [ "$status" -eq 0 ]; then
              rm -f "$log_file"
              exit 0
            fi

            if ! grep -q "Error code: 429" "$log_file"; then
              echo "Factory failed for a non-rate-limit reason; not retrying automatically."
              rm -f "$log_file"
              exit "$status"
            fi

            rm -f "$log_file"
            if [ "$attempt" -ge "$max_factory_attempts" ]; then
              echo "Gemini rate limit persisted after ${max_factory_attempts} attempts."
              exit "$status"
            fi

            echo "Gemini returned 429. Waiting ${retry_delay_seconds}s, then retrying remaining work in this same run."
            sleep "$retry_delay_seconds"
          done

      - name: Record factory run status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .factory-status/tts
          current_sha="$(git rev-parse HEAD)"
          cat > .factory-status/tts/latest.json <<EOF
          {
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "event": "${GITHUB_EVENT_NAME}",
            "source_sha": "${current_sha}",
            "factory_outcome": "${{ steps.factory.outcome }}",
            "recorded_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Commit factory state
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          git add -A audio done transcripts final .factory-status/tts/latest.json
          if git diff --cached --quiet; then
            echo "No factory state changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(factory): publish generated outputs [skip ci]"

          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Fail workflow if the factory failed
        if: steps.factory.outcome == 'failure'
        run: |
          echo "The factory failed. Any successfully generated state was committed for inspection/retry."
          exit 1
