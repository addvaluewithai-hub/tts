name: Generate TTS audio

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "transcripts/**/*.txt"
      - "transcripts/**/*.md"
      - "tts_config.yaml"
      - "scripts/process_tts.py"
      - "scripts/assemble_lessons.py"
      - "scripts/transcription_core.py"
      - "scripts/transcribe_final.py"
      - "requirements.txt"

permissions:
  contents: write

concurrency:
  group: gemini-tts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Generate audio
        id: tts
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/process_tts.py

      - name: Assemble final lesson audio
        id: assemble
        if: steps.tts.outcome == 'success'
        continue-on-error: true
        run: python scripts/assemble_lessons.py

      - name: Create timestamped final transcript
        id: transcribe
        if: steps.assemble.outcome == 'success'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/transcribe_final.py

      - name: Commit generated outputs
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No repository changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio done transcripts
          if [ -d final ]; then
            git add final
          fi
          git commit -m "chore(tts): generate lesson audio and timing transcript"
          git push

      - name: Fail workflow if a pipeline stage failed
        if: >-
          steps.tts.outcome == 'failure' ||
          steps.assemble.outcome == 'failure' ||
          steps.transcribe.outcome == 'failure'
        run: |
          echo "One or more TTS pipeline stages failed. Successful outputs were committed for inspection/retry."
          exit 1
