name: TTS Factory

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "transcripts/**/*.txt"
      - "transcripts/**/*.md"
      - "tts_config.yaml"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/generate-tts.yml"

permissions:
  contents: write

concurrency:
  group: tts-factory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run factory
        id: factory
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/run_factory.py

      - name: Commit factory state
        shell: bash
        run: |
          set -euo pipefail

          git add -A audio done transcripts final
          if git diff --cached --quiet; then
            echo "No factory state changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(factory): publish generated outputs [skip ci]"

          # A newer commit may have landed while model calls were running.
          # Rebase generated state before pushing instead of failing a non-fast-forward push.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Fail workflow if the factory failed
        if: steps.factory.outcome == 'failure'
        run: |
          echo "The factory failed. Any successfully generated state was committed for inspection/retry."
          exit 1
