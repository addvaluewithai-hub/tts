name: Video Factory — Silent Motion Preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/video-motion-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: video-factory-motion-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve active production
        id: active
        shell: bash
        run: |
          set -euo pipefail
          JOB="$(grep -Ev '^\s*(#|$)' input/ACTIVE | head -1)"
          PROJECT="productions/${JOB}/video"
          test -d "$PROJECT"
          test -s "final/${JOB}.wav"
          test -s "final/${JOB}.transcript.json"
          echo "job=$JOB" >> "$GITHUB_OUTPUT"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Build exact-timing composition
        shell: bash
        env:
          JOB: ${{ steps.active.outputs.job }}
          PROJECT: ${{ steps.active.outputs.project }}
        run: |
          set -euo pipefail
          mkdir -p "$PROJECT/assets/audio"
          cp "final/${JOB}.wav" "$PROJECT/assets/audio/${JOB}.wav"
          cp "final/${JOB}.transcript.json" "$PROJECT/assets/audio/${JOB}.transcript.json"
          if [ -f "$PROJECT/scripts/prepare-assets.sh" ]; then
            (cd "$PROJECT" && bash scripts/prepare-assets.sh)
          fi
          cd "$PROJECT"
          FACTORY_JOB_ID="$JOB" node scripts/build-from-audio.mjs
          test -s index.html
          test -s build-meta.json

      - name: Limit preview composition to first 45 seconds
        shell: bash
        env:
          PROJECT: ${{ steps.active.outputs.project }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          p = Path('${{ steps.active.outputs.project }}/index.html')
          text = p.read_text(encoding='utf-8')
          text, n1 = re.subn(r'(id="stage"[\s\S]*?data-duration=")[^"]+', r'\g<1>45', text, count=1)
          text, n2 = re.subn(r'(<audio[\s\S]*?data-duration=")[^"]+', r'\g<1>45', text, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'preview duration rewrite failed: stage={n1} audio={n2}')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Render V4 motion preview
        shell: bash
        env:
          PROJECT: ${{ steps.active.outputs.project }}
        run: |
          set -euo pipefail
          cd "$PROJECT"
          npx --yes hyperframes@latest render . -c ./index.html --quality draft --workers 2 --output motion-preview-with-audio.mp4

      - name: Create silent 720p preview
        shell: bash
        env:
          PROJECT: ${{ steps.active.outputs.project }}
        run: |
          set -euo pipefail
          cd "$PROJECT"
          ffmpeg -nostdin -loglevel error -y \
            -i motion-preview-with-audio.mp4 \
            -an -vf 'scale=1280:-2' -r 24 \
            -c:v libx264 -preset veryfast -crf 25 -pix_fmt yuv420p -movflags +faststart \
            airline-v4-motion-preview-silent-45s-720p.mp4
          test -s airline-v4-motion-preview-silent-45s-720p.mp4

      - name: Upload silent motion preview
        uses: actions/upload-artifact@v4
        with:
          name: airline-v4-motion-preview-silent-45s
          path: ${{ steps.active.outputs.project }}/airline-v4-motion-preview-silent-45s-720p.mp4
          if-no-files-found: error
          retention-days: 14
